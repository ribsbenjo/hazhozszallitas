<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Erb Házhozszállítás</title>
<style>
  :root {
    --brand: #7A1F3D; --brandDark: #5A1530; --gold: #C9A227; --goldDark: #7D600C; --goldTint: #FBF4DC;
    --text: #1F2937; --muted: #4B5563; --line: #E4DCDF; --bg: #F7F3F4; --soft: #F5EAEE; --white: #FFFFFF;
    --green: #2E7D5B; --greenTint: #E6F2EC; --red: #A8322A; --redTint: #FBECEA;
    --r: 14px;
    --serif: "Calisto MT", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 18px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; border: 0; background: none; transition: background .15s, border-color .15s, color .15s; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  input, textarea { font-family: inherit; font-size: 18px; color: var(--text); }
  .app { max-width: 560px; margin: 0 auto; min-height: 100vh; background: var(--bg); padding-bottom: 150px; }
  h1, h2, h3 { font-family: var(--serif); }

  /* header */
  header { background: var(--brand); color: var(--white); padding: 22px 16px 24px; border-bottom: 4px solid var(--gold); }
  .kicker { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: #F0D77F; font-weight: 600; }
  header h1 { margin: 4px 0 6px; font-size: 32px; line-height: 1.1; }
  header p { margin: 0; color: #F6E6EC; font-size: 17px; }

  /* steps */
  .steps { display: flex; background: var(--white); padding: 12px 8px; position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--line); }
  .steps:empty { display: none; }
  .step { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; font-size: 15px; line-height: 1.2; color: #8A8F99; }
  .step i { font-style: normal; line-height: 1; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 700; background: #EEE8EA; color: var(--muted); }
  .step.past { color: var(--text); }
  .step.past i { background: var(--gold); color: var(--white); }
  .step.on { color: var(--brand); font-weight: 700; }
  .step.on i { background: var(--brand); color: var(--white); }
  .step:disabled { cursor: default; }

  main { padding: 22px 16px; }
  h2 { color: var(--brand); font-size: 28px; line-height: 1.2; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 17px; }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: var(--r); }

  /* village list */
  .group { font-family: var(--sans); font-size: 15px; font-weight: 700; color: var(--goldDark); text-transform: uppercase; letter-spacing: .06em; margin: 22px 0 8px; }
  .group:first-of-type { margin-top: 4px; }
  .list { background: var(--white); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .place { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px; min-height: 60px; text-align: left; font-size: 19px; font-weight: 600; border-bottom: 1px solid var(--line); }
  .place:last-child { border-bottom: 0; }
  .place:hover { background: var(--soft); }
  .place::after { content: "›"; font-size: 28px; line-height: 1; color: #B9AEB3; font-weight: 400; }
  .place.on { background: var(--soft); color: var(--brand); box-shadow: inset 4px 0 0 var(--brand); }
  .place.on::after { content: "✓"; font-size: 20px; color: var(--brand); font-weight: 700; }
  .info { margin-top: 22px; background: var(--goldTint); border-radius: var(--r); padding: 16px; font-size: 17px; }
  .info b { color: var(--goldDark); }

  /* shop */
  .where { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--white); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 16px; }
  .where div { font-size: 16px; color: var(--muted); line-height: 1.35; }
  .where div b { display: block; color: var(--text); font-size: 19px; }
  .link { color: var(--brand); font-weight: 600; font-size: 16px; text-decoration: underline; text-underline-offset: 3px; padding: 8px 4px; flex: none; }

  .usual { display: flex; align-items: center; gap: 14px; padding: 16px; margin-bottom: 20px; border-radius: var(--r); background: var(--goldTint); border: 1px solid #EBDCA2; }
  .usual div { flex: 1; font-size: 16px; color: var(--muted); }
  .usual div b { display: block; font-size: 19px; color: var(--text); font-family: var(--serif); }
  .btn-sec { background: var(--brand); color: var(--white); padding: 12px 18px; min-height: 48px; border-radius: 999px; font-weight: 700; font-size: 17px; flex: none; }

  .cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
  .cat { display: flex; align-items: center; gap: 8px; padding: 10px 12px; min-height: 52px; border-radius: 12px; background: var(--white); border: 1.5px solid var(--line); font-size: 17px; text-align: left; line-height: 1.2; }
  .cat .ce { font-size: 22px; line-height: 1; }
  .cat.on { background: var(--brand); color: var(--white); border-color: var(--brand); font-weight: 600; }

  .items { display: grid; gap: 10px; }
  .item { display: flex; align-items: center; gap: 14px; padding: 14px; }
  .item.in { border-color: var(--brand); }
  .em { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; font-size: 30px; flex: none; background: var(--soft); }
  .item .txt { flex: 1; min-width: 0; }
  .item .name { font-size: 18px; font-weight: 600; line-height: 1.25; }
  .item .unit { font-size: 15px; color: var(--muted); }
  .item .price { font-size: 18px; color: var(--brand); font-weight: 700; margin-top: 2px; }
  .qty { display: flex; align-items: center; gap: 4px; flex: none; }
  .qty button { width: 46px; height: 46px; border-radius: 50%; font-size: 26px; line-height: 1; display: grid; place-items: center; }
  .qty .minus { background: var(--white); color: var(--brand); border: 2px solid var(--brand); }
  .qty .plus { background: var(--brand); color: var(--white); }
  .qty .n { min-width: 28px; text-align: center; font-weight: 700; font-size: 20px; }
  .add { background: var(--brand); color: var(--white); padding: 0 18px; height: 48px; border-radius: 999px; font-size: 17px; font-weight: 700; flex: none; }

  /* cart */
  .lines .line { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px; border-bottom: 1px solid var(--line); }
  .lines .line:last-child { border-bottom: 0; }
  .lines .line .l { display: flex; align-items: center; gap: 12px; min-width: 0; font-weight: 600; line-height: 1.25; }
  .lines .em { width: 44px; height: 44px; font-size: 24px; }
  .lines .line small { color: var(--muted); font-size: 15px; display: block; font-weight: 400; margin-top: 2px; }
  .sum { padding: 16px; }
  .sum .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 17px; color: var(--muted); }
  .sum .row.total { color: var(--text); font-size: 22px; font-weight: 700; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 12px; }
  .meter { height: 10px; background: #EEE8EA; border-radius: 99px; overflow: hidden; margin: 14px 0 6px; }
  .meter i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .3s; }
  .meter.full i { background: var(--green); }
  .hint { font-size: 16px; color: var(--muted); }
  .hint b { color: var(--text); }
  .meter.full + .hint b { color: var(--green); }
  .warn { color: var(--red); font-size: 16px; margin-top: 10px; background: var(--redTint); padding: 10px 12px; border-radius: 10px; }

  .field { margin-bottom: 18px; }
  .field > label, .field > .lbl { display: block; font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .field input, .field textarea { width: 100%; padding: 14px; min-height: 54px; border: 2px solid var(--line); border-radius: 12px; background: var(--white); }
  .field input::placeholder, .field textarea::placeholder { color: #9CA1AA; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--brand); }
  .opt { font-weight: 400; color: var(--muted); }
  .days { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .day { padding: 12px 14px; min-height: 54px; border-radius: 12px; border: 2px solid var(--line); background: var(--white); text-align: left; line-height: 1.3; }
  .day b { display: block; font-size: 18px; } .day span { font-size: 15px; color: var(--muted); }
  .day.on { border-color: var(--brand); background: var(--soft); color: var(--brand); }
  .pay { display: flex; gap: 8px; }
  .pay .day { flex: 1; text-align: center; }

  .empty { text-align: center; padding: 32px 16px; color: var(--muted); }
  .empty .big { font-size: 44px; }

  /* bottom bar */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--white); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.06); z-index: 10; }
  .bar .in { max-width: 528px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
  .bar .meta { flex: 1; font-size: 15px; color: var(--muted); line-height: 1.3; }
  .bar .meta b { display: block; color: var(--text); font-size: 22px; }
  .bar .why { max-width: 528px; margin: 8px auto 0; font-size: 15px; color: var(--red); line-height: 1.35; }
  .cta { background: var(--brand); color: var(--white); padding: 0 24px; height: 56px; border-radius: 14px; font-size: 18px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
  .cta:hover:not(:disabled) { background: var(--brandDark); }
  .cta:disabled { background: #C9CDD3; cursor: not-allowed; }
  .call { display: flex; align-items: center; gap: 14px; margin: 16px 0 0; padding: 16px; border-radius: var(--r); border: 1px solid var(--line); color: var(--text); font-size: 17px; text-decoration: none; background: var(--white); }
  .call .ico { width: 46px; height: 46px; border-radius: 50%; background: var(--green); display: grid; place-items: center; flex: none; }
  .call svg { width: 20px; height: 20px; fill: var(--white); }
  .call b { color: var(--green); }

  .done { text-align: center; padding: 30px 8px; }
  .done .check { width: 88px; height: 88px; margin: 6px auto 18px; border-radius: 50%; background: var(--green); display: grid; place-items: center; }
  .done .check svg { width: 42px; height: 42px; fill: var(--white); }
  .done h2 { font-size: 30px; }
  .done .when { background: var(--goldTint); border-radius: var(--r); padding: 18px; margin: 18px 0; font-size: 18px; }
  .done .when b { color: var(--text); font-size: 24px; display: block; font-family: var(--serif); }

  .notice { margin-top: 14px; background: #EEF3FA; border: 1px solid #CFDCEF; color: var(--text); border-radius: var(--r); padding: 14px 16px; font-size: 17px; text-align: left; }
  .notice b { color: #1F4E8C; }
  .toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--white); padding: 12px 20px; border-radius: 999px; font-size: 16px; opacity: 0; transition: .25s; pointer-events: none; z-index: 20; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (min-width: 600px) { .app { box-shadow: 0 0 30px rgba(0,0,0,.06); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="kicker">Erb és Társai • Bóly</div>
    <h1>Házhozszállítás</h1>
    <p>Friss hús, zöldség és a napi bevásárlás – az ajtóig hozzuk.</p>
  </header>

  <nav class="steps" id="steps"></nav>
  <main id="view"></main>
</div>

<div class="bar" id="bar"><div class="in" id="barIn"></div></div>
<div class="toast" id="toast"></div>

<script src="store.js"></script>
<script>
const PHONE = '+36 20 270 4009';
const FREE_OVER = 10000, FEE = 490;

// Bóly daily (Mon–Sat); villages ≤10 km on two fixed routes, two days each
const PLACES = [
  { id: 'boly', name: 'Bóly', km: 0, days: [1, 2, 3, 4, 5, 6], min: 5000, home: true },
  { id: 'szajk', name: 'Szajk', km: 5.6, days: [2, 5], min: 8000 },
  { id: 'babarc', name: 'Babarc', km: 7.8, days: [2, 5], min: 8000 },
  { id: 'borjad', name: 'Borjád', km: 6.6, days: [2, 5], min: 8000 },
  { id: 'monyorod', name: 'Monyoród', km: 7.9, days: [2, 5], min: 8000 },
  { id: 'szederkeny', name: 'Szederkény', km: 8.2, days: [2, 5], min: 8000 },
  { id: 'nagynyarad', name: 'Nagynyárád', km: 5.5, days: [3, 6], min: 8000 },
  { id: 'versend', name: 'Versend', km: 6.0, days: [3, 6], min: 8000 },
  { id: 'tottos', name: 'Töttös', km: 6.1, days: [3, 6], min: 8000 },
  { id: 'pocsa', name: 'Pócsa', km: 9.4, days: [3, 6], min: 8000 },
];
const DAYN = ['vasárnap', 'hétfő', 'kedd', 'szerda', 'csütörtök', 'péntek', 'szombat'];

const CATS = [
  { id: 'hus', e: '🥩', name: 'Friss hús' }, { id: 'zold', e: '🥕', name: 'Zöldség, gyümölcs' }, { id: 'pek', e: '🍞', name: 'Pékáru' },
  { id: 'tej', e: '🥛', name: 'Tej, tojás, sajt' }, { id: 'alap', e: '🌾', name: 'Alapélelmiszer' }, { id: 'drog', e: '🧴', name: 'Háztartás' },
];
const ITEMS = [
  { id: 1, c: 'hus', e: '🥩', n: 'Sertéskaraj, csontos', u: 'kb. 1 kg, saját bontás', p: 2990 },
  { id: 2, c: 'hus', e: '🍖', n: 'Sertéscomb', u: 'kb. 1 kg', p: 2690 },
  { id: 3, c: 'hus', e: '🍗', n: 'Csirkemell filé', u: '1 kg', p: 2790 },
  { id: 4, c: 'hus', e: '🌭', n: 'Házi kolbász', u: '50 dkg', p: 2190 },
  { id: 5, c: 'hus', e: '🥓', n: 'Füstölt szalonna', u: '50 dkg', p: 1890 },
  { id: 6, c: 'zold', e: '🥔', n: 'Burgonya', u: '2 kg', p: 790 },
  { id: 7, c: 'zold', e: '🍅', n: 'Paradicsom', u: '1 kg', p: 1290 },
  { id: 8, c: 'zold', e: '🧅', n: 'Vöröshagyma', u: '1 kg', p: 490 },
  { id: 9, c: 'zold', e: '🍎', n: 'Alma', u: '1 kg', p: 590 },
  { id: 10, c: 'zold', e: '🫑', n: 'TV paprika', u: '50 dkg', p: 890 },
  { id: 11, c: 'pek', e: '🍞', n: 'Fehér kenyér', u: '1 kg, friss', p: 890 },
  { id: 12, c: 'pek', e: '🥖', n: 'Kifli', u: '1 db', p: 50 },
  { id: 13, c: 'pek', e: '🥐', n: 'Kakaós csiga', u: '1 db', p: 290 },
  { id: 14, c: 'tej', e: '🥛', n: 'Tej 2,8%', u: '1 l', p: 399 },
  { id: 15, c: 'tej', e: '🥚', n: 'Tojás', u: '10 db', p: 990 },
  { id: 16, c: 'tej', e: '🧀', n: 'Trappista sajt', u: '50 dkg', p: 2190 },
  { id: 17, c: 'tej', e: '🧈', n: 'Vaj', u: '200 g', p: 990 },
  { id: 18, c: 'alap', e: '🌾', n: 'Liszt BL55', u: '1 kg', p: 299 },
  { id: 19, c: 'alap', e: '🍚', n: 'Rizs', u: '1 kg', p: 690 },
  { id: 20, c: 'alap', e: '🫙', n: 'Napraforgóolaj', u: '1 l', p: 799 },
  { id: 21, c: 'alap', e: '🍬', n: 'Kristálycukor', u: '1 kg', p: 449 },
  { id: 22, c: 'alap', e: '☕', n: 'Őrölt kávé', u: '250 g', p: 1690 },
  { id: 23, c: 'drog', e: '🧻', n: 'Toalettpapír', u: '8 tekercs', p: 1490 },
  { id: 24, c: 'drog', e: '🧼', n: 'Mosogatószer', u: '500 ml', p: 590 },
  { id: 25, c: 'drog', e: '🧺', n: 'Mosópor', u: '20 mosás', p: 2990 },
];
const USUAL = { 11: 1, 14: 2, 15: 1, 6: 1, 1: 1, 16: 1, 9: 1 }; // sample "törzskosár"

const S = { step: 0, place: null, cat: 'hus', cart: {}, day: null, pay: 'kp', name: '', addr: '', phone: '', note: '', orderNo: null };
try { const saved = JSON.parse(localStorage.getItem('hazhozszallitas') || 'null'); if (saved) Object.assign(S, saved, { step: saved.place ? 1 : 0, orderNo: null }); } catch (e) {}
const save = () => { try { localStorage.setItem('hazhozszallitas', JSON.stringify({ place: S.place, cart: S.cart, name: S.name, addr: S.addr, phone: S.phone, pay: S.pay })); } catch (e) {} };

const ft = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0") + "\u00a0Ft";
const place = () => PLACES.find(p => p.id === S.place);
const subtotal = () => Object.entries(S.cart).reduce((a, [id, q]) => a + ITEMS.find(i => i.id == id).p * q, 0);
const count = () => Object.values(S.cart).reduce((a, b) => a + b, 0);
const fee = () => subtotal() >= FREE_OVER ? 0 : FEE;
const daysText = p => p.home ? 'hétfőtől szombatig, minden nap' : p.days.map(d => DAYN[d]).join(' és ');

function nextDates(p, n = 4) {
  const out = [], d = new Date(); d.setHours(0, 0, 0, 0);
  const cutoffPassed = new Date().getHours() >= 11; // phone/online orders until 11:00 for same day
  for (let i = cutoffPassed ? 1 : 0; out.length < n && i < 21; i++) {
    const x = new Date(d); x.setDate(d.getDate() + i);
    if (p.days.includes(x.getDay())) out.push(x);
  }
  return out;
}
const dateLabel = x => {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((x - t) / 864e5);
  const head = diff === 0 ? 'Ma' : diff === 1 ? 'Holnap' : DAYN[x.getDay()][0].toUpperCase() + DAYN[x.getDay()].slice(1);
  return { head, sub: x.toLocaleDateString('hu-HU', { month: 'long', day: 'numeric' }) };
};

function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1600); }
function setQty(id, d) { const q = (S.cart[id] || 0) + d; if (q <= 0) delete S.cart[id]; else S.cart[id] = q; save(); render(); }
function go(step) { S.step = step; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

const ICON_CALL = '<svg viewBox="0 0 512 512"><path d="M164.9 24.6c-7.7-18.6-28-28.5-47.4-23.2l-88 24C12.1 30.2 0 46 0 64c0 247.4 200.6 448 448 448 18 0 33.8-12.1 38.6-29.5l24-88c5.3-19.4-4.6-39.7-23.2-47.4l-96-40c-16.3-6.8-35.2-2.1-46.3 11.6L304.7 368c-70.4-33.3-127.4-90.3-160.7-160.7l49.3-40.3c13.7-11.2 18.4-30 11.6-46.3l-40-96z"/></svg>';
const ICON_BASKET = '<svg viewBox="0 0 576 512"><path d="M253.3 35.1c6.1-11.8 1.5-26.3-10.2-32.4s-26.3-1.5-32.4 10.2L117.6 192H32c-17.7 0-32 14.3-32 32s14.3 32 32 32L83.9 463.5C91 492 116.6 512 146 512h284c29.4 0 55-20 62.1-48.5L544 256c17.7 0 32-14.3 32-32s-14.3-32-32-32h-85.6L365.3 12.9C359.2 1.2 344.7-3.4 332.9 2.7s-16.3 20.6-10.2 32.4L404.3 192H171.7l81.6-156.9z"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 448 512"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg>';
const callLink = () => `<a class="call" href="tel:${PHONE.replace(/\s/g, '')}"><span class="ico">${ICON_CALL}</span><span>Inkább telefonon rendelne? Hívjon 8 és 11 óra között:<br><b>${PHONE}</b></span></a>`;

function renderSteps() {
  const names = ['Hová?', 'Vásárlás', 'Kosár', 'Átvétel'];
  const can = [true, !!S.place, !!S.place, !!S.place && count() > 0];
  document.getElementById('steps').innerHTML = S.orderNo ? '' : names.map((n, i) =>
    `<button class="step ${S.step === i ? 'on' : i < S.step ? 'past' : ''}" ${can[i] ? '' : 'disabled'} onclick="go(${i})"><i>${i < S.step ? '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : i + 1}</i><span>${n}</span></button>`).join('');
}

function viewPlace() {
  const groups = [['Minden nap, hétfőtől szombatig', x => x.home], ['Kedden és pénteken', x => !x.home && x.days[0] === 2], ['Szerdán és szombaton', x => !x.home && x.days[0] === 3]];
  return `<h2>Hová szállítsunk?</h2><p class="sub">Koppintson a településére.</p>
  ${groups.map(([t, fn]) => `<h3 class="group">${t}</h3><div class="list">${PLACES.filter(fn).map(x =>
    `<button class="place ${S.place === x.id ? 'on' : ''}" onclick="S.place='${x.id}';S.day=null;save();go(1)">${x.name}</button>`).join('')}</div>`).join('')}
  <div class="info"><b>${ft(FREE_OVER)} felett ingyen hozzuk</b>, alatta ${ft(FEE)} a kiszállítás. Az ajtóban fizet, készpénzzel vagy kártyával.</div>
  ${callLink()}`;
}

function viewShop() {
  const p = place();
  const list = ITEMS.filter(i => i.c === S.cat);
  return `<div class="where"><div><b>${p.name}</b>Szállítás: ${daysText(p)}</div><button class="link" onclick="go(0)">Módosítás</button></div>
  <div class="usual"><div><b>Heti törzskosár</b>Kenyér, tej, tojás, krumpli, karaj, sajt és alma egyben.</div>
    <button class="btn-sec" onclick="addUsual()">Kérem</button></div>
  <h2>Mit hozzunk?</h2><p class="sub">Válasszon csoportot.</p>
  <div class="cats">${CATS.map(c => `<button class="cat ${S.cat === c.id ? 'on' : ''}" onclick="S.cat='${c.id}';render()"><span class="ce">${c.e}</span>${c.name}</button>`).join('')}</div>
  <div class="items">${list.map(i => {
    const q = S.cart[i.id] || 0;
    return `<div class="card item ${q ? 'in' : ''}"><div class="em">${i.e}</div><div class="txt"><div class="name">${i.n}</div><div class="unit">${i.u}</div><div class="price">${ft(i.p)}</div></div>
      ${q ? `<div class="qty"><button class="minus" aria-label="Kevesebb" onclick="setQty(${i.id},-1)">−</button><span class="n">${q}</span><button class="plus" aria-label="Több" onclick="setQty(${i.id},1)">+</button></div>`
          : `<button class="add" onclick="setQty(${i.id},1)">Kosárba</button>`}</div>`;
  }).join('')}</div>`;
}
function addUsual() { for (const [id, q] of Object.entries(USUAL)) S.cart[id] = Math.max(S.cart[id] || 0, q); save(); render(); toast('A törzskosár a kosárban van'); }

function summary() {
  const p = place(), sub = subtotal(), f = fee();
  const toFree = FREE_OVER - sub;
  return `<div class="sum">
    <div class="row"><span>Termékek</span><span>${ft(sub)}</span></div>
    <div class="row"><span>Kiszállítás</span><span>${f ? ft(f) : 'ingyenes'}</span></div>
    <div class="row total"><span>Összesen</span><span>${ft(sub + f)}</span></div>
    <div class="meter ${toFree <= 0 ? 'full' : ''}"><i style="width:${Math.min(100, sub / FREE_OVER * 100)}%"></i></div>
    <div class="hint">${toFree > 0 ? `Még <b>${ft(toFree)}</b> és ingyen visszük.` : '<b>Ingyenes kiszállítás.</b>'}</div>
    ${sub < p.min ? `<div class="warn">${p.name}: a legkisebb rendelés ${ft(p.min)}.</div>` : ''}
  </div>`;
}

function viewCart() {
  const ids = Object.keys(S.cart);
  if (!ids.length) return `<h2>Kosár</h2><div class="card empty"><div class="big">🧺</div><p>Még üres a kosár.</p><button class="cta" onclick="go(1)">Vásárlás</button></div>${callLink()}`;
  return `<h2>Kosár</h2><p class="sub">A húst és a zöldséget aznap reggel mérjük ki, ezért a végösszeg néhány forinttal eltérhet.</p>
  <div class="card lines">${ids.map(id => { const i = ITEMS.find(x => x.id == id), q = S.cart[id];
    return `<div class="line"><div class="l"><div class="em">${i.e}</div><div>${i.n}<small>${i.u} • ${ft(i.p)}</small></div></div>
      <div class="qty"><button class="minus" aria-label="Kevesebb" onclick="setQty(${i.id},-1)">−</button><span class="n">${q}</span><button class="plus" aria-label="Több" onclick="setQty(${i.id},1)">+</button></div></div>`; }).join('')}</div>
  <div class="card" style="margin-top:12px">${summary()}</div>`;
}

function viewCheckout() {
  const p = place(), dates = nextDates(p);
  if (S.day == null || !dates.some(d => +d === S.day)) S.day = +dates[0];
  const f = (k, l, type = 'text', ph = '') => `<div class="field"><label for="${k}">${l}</label><input id="${k}" type="${type}" placeholder="${ph}" value="${S[k] || ''}" autocomplete="${{name:'name',addr:'street-address',phone:'tel'}[k]}" oninput="S.${k}=this.value;save();renderBar()"></div>`;
  return `<h2>Mikor és hová?</h2><p class="sub">Délután visszük, ide: ${p.name}.</p>
  <div class="field"><span class="lbl">Melyik napon?</span><div class="days">${dates.map(d => { const l = dateLabel(d);
    return `<button class="day ${S.day === +d ? 'on' : ''}" onclick="S.day=${+d};render()"><b>${l.head}</b><span>${l.sub}, délután</span></button>`; }).join('')}</div></div>
  ${f('name', 'Név', 'text', 'Kovács Mária')}
  ${f('addr', 'Cím', 'text', p.home ? 'Bóly, Rákóczi u. 12.' : p.name + ', Fő u. 5.')}
  ${f('phone', 'Telefonszám', 'tel', '06 30 123 4567')}
  <div class="field"><span class="lbl">Hogyan fizet az ajtóban?</span><div class="pay">
    <button class="day ${S.pay === 'kp' ? 'on' : ''}" onclick="S.pay='kp';save();render()"><b>Készpénz</b></button>
    <button class="day ${S.pay === 'kartya' ? 'on' : ''}" onclick="S.pay='kartya';save();render()"><b>Bankkártya</b></button></div></div>
  <div class="field"><label for="note">Megjegyzés <span class="opt">(nem kötelező)</span></label><textarea id="note" rows="2" placeholder="pl. a kapucsengő nem működik, kopogjanak" oninput="S.note=this.value">${S.note || ''}</textarea></div>
  <div class="card">${summary()}</div>
  <div class="notice" id="callnote" style="display:none"></div>`;
}

function viewDone() {
  const l = dateLabel(new Date(S.day));
  return `<div class="done"><div class="check">${ICON_CHECK}</div><h2>Köszönjük, ${S.name.split(' ').slice(-1)[0] || ''}!</h2>
  <p class="sub">Rendelésszám: <b>${S.orderNo}</b></p>
  <div class="when"><b>${l.head}, ${l.sub}</b>délután visszük ide: ${S.addr}</div>
  ${S.lastCall ? `<div class="notice">Mivel ez az első ${ft(BIG_ORDER)} feletti rendelése, kollégánk hamarosan felhívja a(z) <b>${S.phone}</b> számon, hogy egyeztesse. A rendelést a hívás után készítjük össze.</div>` : ''}
  <p class="sub">Fizetés az ajtóban, ${S.pay === 'kp' ? 'készpénzzel' : 'bankkártyával'}. Ha valami nincs, felhívjuk és megkérdezzük, mivel pótoljuk.</p>
  <button class="cta" onclick="S.orderNo=null;go(1)">Új rendelés</button></div>`;
}

function renderBar() {
  const bar = document.getElementById('bar'), el = document.getElementById('barIn');
  const p = place(), sub = subtotal();
  if (S.orderNo || S.step === 0) { bar.style.display = 'none'; return; }
  bar.style.display = '';
  const meta = `<div class="meta">${count()} tétel<b>${ft(sub + (count() ? fee() : 0))}</b></div>`;
  let btn, why = '';
  const short = count() && sub < p.min ? `Még ${ft(p.min - sub)} hiányzik a legkisebb rendelésig (${ft(p.min)}).` : '';
  if (S.step === 1) btn = `<button class="cta" ${count() ? '' : 'disabled'} onclick="go(2)">Kosár →</button>`;
  else if (S.step === 2) { btn = `<button class="cta" ${count() && sub >= p.min ? '' : 'disabled'} onclick="go(3)">Tovább →</button>`; why = short; }
  else {
    const miss = [['name', 'név'], ['addr', 'cím'], ['phone', 'telefonszám']].filter(([k]) => !(S[k] || '').trim()).map(([, l]) => l);
    btn = `<button class="cta" ${!miss.length && sub >= p.min ? '' : 'disabled'} onclick="placeOrder()">Megrendelem</button>`;
    why = short || (miss.length ? `Még hiányzik: ${miss.join(', ')}.` : '');
    const cn = document.getElementById('callnote'), total = sub + fee();
    if (cn) { const on = normPhone(S.phone).length === 9 && needsCall(loadOrders(), S.phone, total);
      cn.style.display = on ? '' : 'none';
      cn.innerHTML = `<b>Telefonos megerősítés:</b> az első ${ft(BIG_ORDER)} feletti rendelést rövid hívással egyeztetjük, mielőtt összekészítjük.`; }
  }
  el.innerHTML = meta + btn;
  let w = bar.querySelector('.why'); if (!w) { w = document.createElement('div'); w.className = 'why'; bar.appendChild(w); }
  w.textContent = why; w.style.display = why ? '' : 'none';
}

function placeOrder() {
  if (!count() || S.orderNo) return;
  const orders = loadOrders(), p = place(), sub = subtotal(), f = fee(), total = sub + f;
  const call = needsCall(orders, S.phone, total);
  const no = 'HSZ-' + String(Math.floor(1000 + Math.random() * 9000));
  orders.unshift({ no, created: Date.now(), day: S.day, place: p.name, name: S.name.trim(), addr: S.addr.trim(), phone: S.phone.trim(), pay: S.pay, note: (S.note || '').trim(),
    lines: Object.entries(S.cart).map(([id, q]) => { const i = ITEMS.find(x => x.id == id); return { e: i.e, n: i.n, u: i.u, p: i.p, q }; }),
    sub, fee: f, total, status: call ? 'call' : 'new' });
  saveOrders(orders);
  S.orderNo = no; S.lastCall = call; S.cart = {}; S.note = ''; save(); render(); window.scrollTo({ top: 0 });
}

function render() {
  renderSteps();
  const v = document.getElementById('view');
  v.innerHTML = S.orderNo ? viewDone() : [viewPlace, viewShop, viewCart, viewCheckout][S.step]();
  renderBar();
}
render();
</script>
</body>
</html>
